services:
  mongo:
    image: mongo:7
    container_name: auditdemo_mongo
    ports:
      - "27025:27017"
    environment:
      MONGO_INITDB_DATABASE: auditdemo
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
