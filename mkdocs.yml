site_name: auditable_go
site_description: Application-level audit logging for GORM and MongoDB
site_url: https://ivikasavnish.github.io/auditable_go/
repo_url: https://github.com/ivikasavnish/auditable_go
repo_name: ivikasavnish/auditable_go

docs_dir: docs
site_dir: site
exclude_docs: |
  SUMMARY.md

theme:
  name: readthedocs
  highlightjs: true
  custom_dir: theme-overrides
  prev_next_buttons_location: both

nav:
  - Overview: README.md
  - How it works (full anatomy): how-it-works.md
  - Getting started and migration: initial-migration.md
  - Custom diffs and large documents: custom-diff-and-large-documents.md
  - Requirements: auditable.requirements.md
  - Project explainer and review guide: project-explainer.md
  - Publishing: publishing.md

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

strict: true
